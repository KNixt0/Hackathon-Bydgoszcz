[project]
name = "investwatch-ai"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Polish typography (en dash, quotes) is intentional
  "E501",   # long lexicon / message lines
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
