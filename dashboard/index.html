<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm na żywo</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0c0f15; --panel: #121722; --zone: #161c29; --zone-edge: #232b3c;
    --card: #1e2535; --card-edge: #2d3750; --text: #e7eaf0; --muted: #8b94a7; --faint: #5a6378;
    --ok: #3fb950; --bad: #f2564b; --wait: #e0a526; --off: #465065; --accent: #8a96ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
    padding: 14px 20px; border-bottom: 1px solid var(--zone-edge); }
  h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); animation: pulse 2s infinite; }
  .dot.err { background: var(--bad); }
  .dot.demo { background: var(--accent); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(63 185 80 / .55); } 70% { box-shadow: 0 0 0 8px rgb(63 185 80 / 0); } 100% { box-shadow: 0 0 0 0 rgb(63 185 80 / 0); } }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .stat { min-width: 64px; }
  .stat b { display: block; font-size: 18px; font-weight: 650; }
  .stat span { color: var(--muted); font-size: 12px; }
  .mode { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .mode:hover { border-color: var(--accent); }
  .mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } aside { border-left: 0; border-top: 1px solid var(--zone-edge); max-height: none; } }
  .stage { padding: 14px; min-width: 0; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--panel); }
  .err { color: var(--bad); font-size: 13px; margin: 8px 2px 0; min-height: 1em; }
  aside { border-left: 1px solid var(--zone-edge); padding: 14px 16px; max-height: calc(100vh - 66px); overflow: auto; }
  aside h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 2px 0 10px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 10px 1fr; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid #1a2030; }
  li .who { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  li .txt { overflow-wrap: anywhere; }
  li time { grid-column: 2; color: var(--faint); font-size: 12px; }
  li.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { from { background: rgb(138 150 255 / .14); } to { background: transparent; } }
  .comments { list-style: none; margin: 0 0 22px; padding: 0; }
  .comments li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 3px 10px; padding: 9px 0; border-bottom: 1px solid #1a2030; }
  .comments .who { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .comments .head { font-size: 13px; } .comments .head a { color: var(--accent); text-decoration: none; }
  .comments .head a:hover { text-decoration: underline; }
  .comments .cbody { grid-column: 2; color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .comments .cbody.open { -webkit-line-clamp: unset; }
  .comments .acts { grid-column: 2; display: flex; gap: 8px; }
  .linkbtn { font: inherit; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .linkbtn:focus-visible, .reply textarea:focus-visible, .reply button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reply { grid-column: 2; display: grid; gap: 6px; margin-top: 4px; }
  .reply textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--card-edge); border-radius: 8px; padding: 8px; min-height: 70px; resize: vertical; }
  .reply .row { display: flex; gap: 8px; align-items: center; }
  .reply button { font: inherit; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--card-edge); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .reply button.primary { border-color: var(--accent); }
  .reply .msg { font-size: 12px; color: var(--muted); }
  .agents { display: grid; margin-bottom: 22px; }
  .agent { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #1a2030; }
  .agent .st { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .agent .st.online { background: var(--ok); } .agent .st.busy { background: var(--wait); }
  .agent .nm { font-weight: 600; overflow-wrap: anywhere; }
  .agent .meta { grid-column: 2 / -1; color: var(--muted); font-size: 12px; }
  .agent.off { opacity: .55; }
  .tier { font: 600 10px ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--card-edge); color: var(--muted); }
  .tier.strong { color: #c9a7ff; } .tier.light { color: #9be3b0; }
  .empty { color: var(--faint); font-size: 13px; padding: 4px 0 8px; }
  .roles { display: grid; gap: 2px; margin-bottom: 22px; }
  .role { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 8px 0; border-bottom: 1px solid #1a2030; }
  .role b { font-weight: 600; }
  .role .who { grid-column: 1; color: var(--muted); font-size: 12px; }
  .role .does { grid-column: 1 / -1; color: var(--faint); font-size: 12px; }
  .role .var { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .pill { grid-column: 2; grid-row: 1 / span 2; align-self: start; font: 600 11px ui-monospace, Menlo, monospace;
    padding: 3px 7px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-edge); white-space: nowrap; }
  .pill.opus { color: #c9a7ff; } .pill.sonnet { color: #8fd3ff; } .pill.haiku { color: #9be3b0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin: 10px 2px 0; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  @media (prefers-reduced-motion: reduce) { .dot.on, li.fresh { animation: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Swarm na żywo</h1>
    <div class="sub"><span id="dot" class="dot"></span><span id="status">łączenie…</span></div>
  </div>
  <div class="stats" aria-label="Podsumowanie">
    <div class="stat"><b id="s-ready">0</b><span>do wzięcia</span></div>
    <div class="stat"><b id="s-work">0</b><span>w pracy</span></div>
    <div class="stat"><b id="s-review">0</b><span>w recenzji</span></div>
    <div class="stat"><b id="s-blocked">0</b><span>zablokowane</span></div>
    <div class="stat"><b id="s-merged">0</b><span>zmergowane</span></div>
  </div>
  <button id="mode" class="mode" type="button"></button>
</header>
<main>
  <div class="stage">
    <canvas id="c" role="img" aria-label="Animowana mapa pracy agentów: zadania, warsztat, recenzja i main"></canvas>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>zielone</span>
      <span><i style="background:var(--wait)"></i>w toku</span>
      <span><i style="background:var(--bad)"></i>błąd / czeka</span>
      <span><i style="background:var(--off)"></i>brak</span>
      <span>Lampki w recenzji: <b>CI</b> · <b>AI</b> (recenzja Claude) · <b>Ty</b> (zatwierdzenie właściciela)</span>
    </div>
    <p id="err" class="err" role="alert"></p>
  </div>
  <aside>
    <h2>Komentarze</h2>
    <ol id="comments" class="comments"></ol>
    <h2>Agenci</h2>
    <div id="agents" class="agents"></div>
    <h2>Kto co robi</h2>
    <div id="roles" class="roles"></div>
    <h2>Aktywność</h2>
    <ol id="feed" aria-live="polite"></ol>
  </aside>
</main>

<script>
(() => {
  "use strict";
  const DEMO = new URLSearchParams(location.search).has("demo");
  const POLL_MS = DEMO ? 2600 : 10000;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = Object.fromEntries(["bg","panel","zone","zone-edge","card","card-edge","text","muted","faint","ok","bad","wait","off","accent"].map(k => [k, css("--" + k)]));

  // ---------- world layout (virtual 1600x900, scaled to the canvas) ----------
  const W = 1600, H = 900;
  const Z = {
    ready:   { x: 24,   y: 24,  w: 340, h: 610, t: "Do wzięcia" },
    work:    { x: 384,  y: 24,  w: 606, h: 610, t: "Warsztat" },
    review:  { x: 1010, y: 24,  w: 360, h: 610, t: "Recenzja" },
    main:    { x: 1390, y: 24,  w: 186, h: 852, t: "main" },
    team:    { x: 24,   y: 654, w: 966, h: 222, t: "Zespół" },
    blocked: { x: 1010, y: 654, w: 360, h: 222, t: "Zablokowane" },
  };
  const CARD_W = 150, CARD_H = 44;

  const hue = s => { let h = 7; for (const ch of s || "?") h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; };
  const tint = (s, l = 62, a = 1) => s ? `hsl(${hue(s)} 68% ${l}% / ${a})` : `hsl(220 10% ${l - 10}% / ${a})`;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let scale = 1, ox = 0, oy = 0;
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    scale = Math.min(canvas.width / W, canvas.height / H);
    ox = (canvas.width - W * scale) / 2; oy = (canvas.height - H * scale) / 2;
  }
  addEventListener("resize", resize);

  // ---------- state → zones ----------
  const labelsOf = i => new Set((i.labels || []).map(l => l.name));
  function zoneOf(issue, pr) {
    const L = labelsOf(issue);
    if (L.has("status:blocked") || L.has("status:needs-decision")) return "blocked";
    if (pr || L.has("status:review")) return "review";
    if (L.has("status:claimed") || (issue.assignees || []).length) return "work";
    return "ready";
  }
  const lamp = (pr, match) => {
    if (!pr) return "NONE";
    const hits = (pr.checks || []).filter(c => match(c.name));
    if (!hits.length) return "NONE";
    const s = hits.map(c => c.state);
    if (s.some(x => ["FAILURE","ERROR","CANCELLED","TIMED_OUT","ACTION_REQUIRED","STARTUP_FAILURE"].includes(x))) return "BAD";
    if (s.every(x => ["SUCCESS"].includes(x))) return "OK";
    if (s.every(x => ["SKIPPED","NEUTRAL"].includes(x))) return "NONE";
    return "WAIT";
  };
  const lampColor = s => ({ OK: C.ok, BAD: C.bad, WAIT: C.wait })[s] || C.off;

  // layout: returns Map key -> {kind, tx, ty, ...}
  function layout(st) {
    const out = new Map();
    const recentComments = {};
    for (const c of st.comments || []) {
      if (Date.now() - new Date(c.at) < 60 * 60000 && !/```ya?ml[\s\S]*checkin:/.test(c.body || "")) recentComments[c.issue] = (recentComments[c.issue] || 0) + 1;
    }
    const agentByIssue = {};
    for (const a of st.agents || []) {
      const n = parseInt(a.working_on, 10);
      if (n && agentStatus(a) !== "offline" && !agentByIssue[n]) agentByIssue[n] = a;
    }
    const prByIssue = {}, loose = [];
    for (const p of st.prs || []) {
      const refs = (p.closingIssuesReferences || []).map(r => r.number);
      refs.length ? refs.forEach(n => (prByIssue[n] = p)) : loose.push(p);
    }
    const zones = { ready: [], work: [], review: [], blocked: [] };
    for (const i of st.issues || []) {
      const pr = prByIssue[i.number] || null;
      if (pr && pr.isDraft && !labelsOf(i).has("status:review")) { zones.work.push(item(i, pr)); continue; }
      zones[zoneOf(i, pr)].push(item(i, pr));
    }
    for (const p of loose) zones.review.push({ key: "p" + p.number, n: p.number, title: p.title, owner: p.author?.login, pr: p, isPR: true, comments: recentComments[p.number] || 0 });
    for (const k in zones) zones[k].sort((a, b) => a.n - b.n);

    // ready board: 2 columns of cards
    const R = Z.ready, perCol = Math.floor((R.h - 64) / (CARD_H + 10));
    zones.ready.slice(0, perCol * 2).forEach((it, k) => {
      const col = k % 2, row = Math.floor(k / 2);
      out.set(it.key, { kind: "card", it, zone: "ready", tx: R.x + 14 + col * (CARD_W + 12), ty: R.y + 52 + row * (CARD_H + 10) });
    });
    // workshop: 3x3 desks
    const Wk = Z.work, cw = Wk.w / 3, ch = (Wk.h - 44) / 3;
    zones.work.slice(0, 9).forEach((it, k) => {
      const cx = Wk.x + cw * (k % 3) + cw / 2, cy = Wk.y + 44 + ch * Math.floor(k / 3);
      out.set(it.key, { kind: "card", it, zone: "work", tx: cx - CARD_W / 2, ty: cy + 18, desk: { x: cx, y: cy } });
      out.set("b" + it.key, { kind: "bot", it, zone: "work", owner: it.owner, tx: cx, ty: cy + 136 });
    });
    // review: rows with three lamps
    const Rv = Z.review;
    zones.review.slice(0, 8).forEach((it, k) => {
      const y = Rv.y + 66 + k * 66;
      const lamps = [
        lamp(it.pr, n => n === "check" || /^ci\b/i.test(n)),
        lamp(it.pr, n => /claude/i.test(n)),
        it.owner === st.owner ? "OK" : lamp(it.pr, n => /owner-approval/i.test(n)),
      ];
      out.set(it.key, { kind: "card", it, zone: "review", tx: Rv.x + 58, ty: y, lamps });
      out.set("b" + it.key, { kind: "bot", it, zone: "review", owner: it.owner, tx: Rv.x + 32, ty: y + CARD_H });
    });
    // blocked
    const B = Z.blocked;
    zones.blocked.slice(0, 6).forEach((it, k) => {
      const col = k % 2, row = Math.floor(k / 2);
      const x = B.x + 40 + col * 166, y = B.y + 48 + row * 56;
      out.set(it.key, { kind: "card", it, zone: "blocked", tx: x, ty: y, w: 120 });
      out.set("b" + it.key, { kind: "bot", it, zone: "blocked", owner: it.owner, tx: x - 16, ty: y + CARD_H - 2 });
    });
    // main: merged PRs as commit nodes, newest on top
    const M = Z.main;
    (st.merged || []).slice(0, 16).forEach((p, k) => {
      out.set("m" + p.number, { kind: "node", it: { n: p.number, title: p.title, owner: p.author?.login }, zone: "main", tx: M.x + 30, ty: M.y + 70 + k * 49 });
    });
    // team: humans
    const team = teamList(st), T = Z.team, step = Math.min(150, (T.w - 60) / Math.max(1, team.length));
    team.forEach((login, k) => {
      out.set("h" + login, { kind: "human", it: { owner: login, isOwner: login === st.owner }, zone: "team",
        tx: T.x + 30 + step / 2 + k * step, ty: T.y + 108 });
    });
    return { out, counts: Object.fromEntries(Object.entries(zones).map(([k, v]) => [k, v.length])), overflow: {
      ready: Math.max(0, zones.ready.length - perCol * 2), work: Math.max(0, zones.work.length - 9),
      review: Math.max(0, zones.review.length - 8), blocked: Math.max(0, zones.blocked.length - 6) } };

    function item(i, pr) {
      const ag = agentByIssue[i.number];
      return { key: "i" + i.number, n: i.number, title: i.title,
        owner: (i.assignees || [])[0]?.login || pr?.author?.login || ag?.operator || null, pr, labels: labelsOf(i),
        agentLabel: ag ? `${ag.tool}·${ag.model}` : null, comments: recentComments[i.number] || 0 };
    }
  }
  function teamList(st) {
    const set = new Set(st.collaborators || []);
    for (const i of st.issues || []) for (const a of i.assignees || []) set.add(a.login);
    for (const p of st.prs || []) if (p.author?.login) set.add(p.author.login);
    const arr = [...set];
    arr.sort((a, b) => (a === st.owner ? -1 : b === st.owner ? 1 : a.localeCompare(b)));
    return arr;
  }

  // ---------- entities ----------
  const ents = new Map();
  let particles = [], firstLoad = true, prevMerged = new Set(), lastState = null, view = null;
  const now = () => performance.now() / 1000;

  function apply(st) {
    lastState = st;
    view = layout(st);
    const t = now();
    const newlyMerged = new Set();
    for (const p of st.merged || []) if (!firstLoad && !prevMerged.has(p.number)) newlyMerged.add(p);
    const closedByMerge = new Map();
    for (const p of newlyMerged) for (const r of p.closingIssuesReferences || []) closedByMerge.set("i" + r.number, p.number);

    // update / spawn
    for (const [key, v] of view.out) {
      let e = ents.get(key);
      if (!e) {
        e = { key, kind: v.kind, seed: Math.random() * 10, born: t, alpha: firstLoad ? 1 : 0, x: v.tx, y: v.ty };
        if (!firstLoad && v.kind === "bot") { const h = ents.get("h" + v.owner); if (h) { e.x = h.x; e.y = h.y - 10; } }
        if (!firstLoad && v.kind === "card" && v.zone !== "ready") { const old = ents.get("p" + v.it.n); if (old) { e.x = old.x; e.y = old.y; } }
        if (!firstLoad && v.kind === "node") { e.y = v.ty - 40; }
        ents.set(key, e);
        if (!firstLoad && v.kind === "card" && v.zone === "work") burst(v.tx + CARD_W / 2, v.ty, tint(v.it.owner), 10);
      }
      Object.assign(e, v, { dying: false, talpha: 1 });
    }
    // die
    for (const [key, e] of ents) {
      if (view.out.has(key) || e.dying) continue;
      e.dying = true; e.talpha = 0; e.diedAt = t;
      if (e.kind === "card" && closedByMerge.has(key)) {
        const node = view.out.get("m" + closedByMerge.get(key));
        if (node) { e.tx = node.tx - 10; e.ty = node.ty - CARD_H / 2; e.fadeDelay = 0.9; }
      } else if (e.kind === "bot") {
        const h = view.out.get("h" + e.owner);
        if (h) { e.tx = h.tx; e.ty = h.ty - 6; e.fadeDelay = 1.6; }
      }
    }
    for (const p of newlyMerged) {
      const node = view.out.get("m" + p.number);
      if (node) setTimeout(() => burst(node.tx, node.ty, tint(p.author?.login), 34), REDUCED ? 0 : 700);
      pushFeed({ actor: p.author?.login, text: `wprowadził PR #${p.number} na main: ${p.title}`, at: new Date().toISOString(), fresh: true });
    }
    prevMerged = new Set((st.merged || []).map(p => p.number));
    firstLoad = false;

    currentAssignments = st.assignments || {}; renderAgents(st.agents); renderComments(st.comments || []);
    // header stats
    const c = view.counts;
    setText("s-ready", c.ready); setText("s-work", c.work); setText("s-review", c.review);
    setText("s-blocked", c.blocked); setText("s-merged", (st.merged || []).length);
  }
  const setText = (id, v) => { const el = document.getElementById(id); if (el.textContent !== String(v)) el.textContent = v; };

  function burst(x, y, color, n) {
    if (REDUCED) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 1, color: Math.random() < .3 ? C.text : color, size: 2 + Math.random() * 3 });
    }
  }

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  const fitCache = new Map();
  function fit(text, maxW, font) {
    const k = font + "|" + maxW + "|" + text;
    if (fitCache.has(k)) return fitCache.get(k);
    ctx.font = font; let s = text || "";
    if (ctx.measureText(s).width > maxW) { while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1); s += "…"; }
    if (fitCache.size > 2000) fitCache.clear();
    fitCache.set(k, s); return s;
  }

  function drawZones(t) {
    for (const [k, z] of Object.entries(Z)) {
      rr(z.x, z.y, z.w, z.h, 14); ctx.fillStyle = C.zone; ctx.fill();
      ctx.strokeStyle = C["zone-edge"]; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = C.muted; ctx.font = "600 13px system-ui, sans-serif";
      ctx.fillText(z.t.toUpperCase(), z.x + 16, z.y + 28);
      const n = view ? (k === "main" ? (lastState?.merged || []).length : k === "team" ? null : view.counts[k]) : null;
      if (n != null) { ctx.textAlign = "right"; ctx.fillStyle = C.faint; ctx.fillText(String(n), z.x + z.w - 16, z.y + 28); ctx.textAlign = "left"; }
      const over = view?.overflow?.[k];

      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
      if (REDUCED || d < 1) { e.x = e.tx; e.y = e.ty; }

    switch (e.type) {

      case "PullRequestEvent":
        if (p.action === "closed") return p.merged ? `zmergował PR ${n}${ti}` : `zamknął PR ${n}`;
        return ({ opened: "otworzył PR", reopened: "otworzył ponownie PR", ready_for_review: "oddał do recenzji PR" })[p.action] ? `${({ opened: "otworzył PR", reopened: "otworzył ponownie PR", ready_for_review: "oddał do recenzji PR" })[p.action]} ${n}${ti}` : null;
      case "PullRequestReviewEvent": return `zrecenzował PR ${n} (${({ approved: "zatwierdzone", changes_requested: "poprawki", commented: "komentarz" })[p.review] || p.review || "?"})`;

      if (work.length && Math.random() < .45) {
        const i = pick(work), who = i.assignees[0].login;
        if (Math.random() < .12) { busy(who, 0); i.labels = L("status:blocked"); ev(who, `#${i.number} → zablokowane (czeka na kontrakt)`); }
        else {
          const pr = { number: prNext++, title: i.title, author: { login: who }, isDraft: false, closingIssuesReferences: [{ number: i.number }],
            checks: [{ name: "check", state: "IN_PROGRESS" }, { name: "claude-review", state: who === "KNixt0" ? "SKIPPED" : "IN_PROGRESS" }, { name: "owner-approval", state: "FAILURE" }] };
          S.prs.push(pr); i.labels = L("status:review"); busy(who, 0); ev(who, `otworzył PR #${pr.number}: ${pr.title}`);
        }
      }
      if (blocked.length && Math.random() < .25) { const i = pick(blocked); i.labels = L("status:claimed"); ev("KNixt0", `odblokował #${i.number}`); }
      for (const p of S.prs) {
        const [ci, ai, own] = p.checks;
        if (ci.state === "IN_PROGRESS" && Math.random() < .5) { ci.state = Math.random() < .88 ? "SUCCESS" : "FAILURE"; if (ci.state === "FAILURE") ev(p.author.login, `CI czerwone w PR #${p.number}`); }
        else if (ci.state === "FAILURE" && Math.random() < .4) { ci.state = "IN_PROGRESS"; ev(p.author.login, `poprawił PR #${p.number}`); }
        if (ai.state === "IN_PROGRESS" && Math.random() < .45) { ai.state = "SUCCESS"; ev("claude", `zrecenzował PR #${p.number}: claude-verdict: APPROVE`); }
        if (own.state === "FAILURE" && ci.state === "SUCCESS" && ai.state !== "IN_PROGRESS" && Math.random() < .35) { own.state = "SUCCESS"; ev("KNixt0", `zatwierdził PR #${p.number}`); }
      }
      const done = S.prs.filter(p => p.checks.every(c => ["SUCCESS", "SKIPPED"].includes(c.state)) || (p.author.login === "KNixt0" && p.checks[0].state === "SUCCESS"));
      if (done.length && Math.random() < .6) {
        const p = done[0]; S.prs = S.prs.filter(x => x !== p);
        S.issues = S.issues.filter(i => i.number !== p.closingIssuesReferences[0].number);
        S.merged.unshift({ number: p.number, title: p.title, author: p.author, closingIssuesReferences: p.closingIssuesReferences });
        S.merged = S.merged.slice(0, 16);
      }
      for (const a of S.agents) a.at = new Date().toISOString();
      apply(JSON.parse(JSON.stringify(S)));
    }
    return tick;
  }

  // ---------- comments panel (+ reply through the local gh login) ----------
  let replyOpen = null;   // issue number with an open reply form (skip re-render while typing)
  function compactBody(b) {
    const m = /```ya?ml([\s\S]*?)```/.exec(b || "");
    if (m && /checkin:/.test(m[1])) {
      const g = k => (new RegExp("^\\s*" + k + ":\\s*(.*)$", "m").exec(m[1]) || [])[1] || "?";
      const owner = g("operator_name").split("#")[0].trim();
      return `meldunek: ${g("agent").split("#")[0].trim()} · ${g("checkin").split("#")[0].trim()} · właściciel: ${owner && owner !== "?" ? owner : "BRAK"}`;
    }
    return (b || "").replace(/```[\s\S]*?```/g, "[blok kodu]").replace(/\n{3,}/g, "\n\n").trim();
  }
  function renderComments(list) {
    if (replyOpen !== null) return;
    const box = document.getElementById("comments");
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const frag = document.createDocumentFragment();
    if (!list.length) frag.append(el("li", "empty", "Brak komentarzy."));
    for (const c of list.slice(0, 15)) {
      const li = el("li"); const dot = el("span", "who"); dot.style.background = tint(c.author);
      const head = el("span", "head"); const b = el("b", null, c.author || "?");
      const a = el("a", null, `#${c.issue}`); a.href = c.url; a.target = "_blank"; a.rel = "noopener";
      head.append(b, " w ", a, ` · ${rel(c.at)}`);
      const body = el("span", "cbody", compactBody(c.body));
      const acts = el("span", "acts");
      const more = el("button", "linkbtn", "Rozwiń"); more.type = "button";
      more.onclick = () => { body.classList.toggle("open"); more.textContent = body.classList.contains("open") ? "Zwiń" : "Rozwiń"; };
      const rep = el("button", "linkbtn", "Odpowiedz"); rep.type = "button";
      rep.onclick = () => openReply(li, c);
      acts.append(more, rep); li.append(dot, head, body, acts); frag.append(li);
    }
    box.replaceChildren(frag);
  }
  function openReply(li, c) {
    if (li.querySelector(".reply")) return;
    replyOpen = c.issue;
    const form = document.createElement("form"); form.className = "reply";
    const id = "reply-" + c.issue + "-" + Date.now();
    const label = document.createElement("label"); label.htmlFor = id; label.className = "msg"; label.textContent = `Odpowiedź w #${c.issue} (jako Twój login gh)`;
    const ta = document.createElement("textarea"); ta.id = id; ta.required = true; ta.maxLength = 5000;
    ta.value = c.author ? `@${c.author} ` : "";
    const row = document.createElement("div"); row.className = "row";
    const send = document.createElement("button"); send.type = "submit"; send.className = "primary"; send.textContent = "Wyślij";
    const cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = "Anuluj";
    const msg = document.createElement("span"); msg.className = "msg"; msg.setAttribute("role", "status");
    cancel.onclick = () => { form.remove(); replyOpen = null; };
    form.onsubmit = async ev => {
      ev.preventDefault();
      if (DEMO) { msg.textContent = "W trybie demo nic nie jest wysyłane."; return; }
      send.disabled = true; msg.textContent = "Wysyłanie…";
      try {
        const r = await fetch("/api/comment", { method: "POST", headers: { "Content-Type": "application/json", "X-Swarm": "1" },
          body: JSON.stringify({ issue: c.issue, body: ta.value }) });
        const res = await r.json();
        if (!res.ok) throw new Error(res.error || "błąd");
        msg.textContent = "Wysłano."; replyOpen = null; setTimeout(pollLive, 800);
      } catch (e) { msg.textContent = "Nie wysłano: " + e.message; send.disabled = false; }
    };
    row.append(send, cancel, msg); form.append(label, ta, row); li.append(form); ta.focus();
  }

  // ---------- agents panel (roster issue, PROTOCOL §0) ----------
  function agentStatus(a) {
    const age = (Date.now() - new Date(a.at || 0)) / 60000;
    if (a.checkin === "offline" || !(age < 30)) return "offline";
    return a.checkin === "busy" ? "busy" : "online";
  }
  let currentAssignments = {};
  function renderAgents(list) {
    const box = document.getElementById("agents");
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const rank = { busy: 0, online: 1, offline: 2 };
    const sorted = [...(list || [])].sort((a, b) => rank[agentStatus(a)] - rank[agentStatus(b)]);
    const frag = document.createDocumentFragment();
    if (!sorted.length) frag.append(el("div", "empty", "Nikt się jeszcze nie zameldował. Agent melduje się przez ./scripts/checkin.sh."));
    for (const a of sorted) {
      const st = agentStatus(a), row = el("div", "agent" + (st === "offline" ? " off" : ""));
      const owner = a.operator_name && a.operator_name.trim() ? a.operator_name : null;
      row.title = `operator: ${a.operator || "?"}`;
      row.append(el("span", "st " + st), el("span", "nm", a.agent), el("span", "tier " + (a.tier || ""), a.tier || "?"));
      const work = st === "busy" && a.working_on && a.working_on !== "none" ? ` · #${a.working_on}` : "";
      const asg = currentAssignments[a.operator]; const asgText = asg && asg !== "none" ? `przydział: ${asg}` : "bez przydziału";
      row.append(el("span", "meta", `${owner ? "właściciel: " + owner : "⚠ brak właściciela — nie liczy się"} · ${asgText} · ${a.tool || "?"} · ${a.model || "?"} · ${st === "offline" ? "offline" : st === "busy" ? "pracuje" : "wolny"}${work} · ${rel(a.at)}`));
      frag.append(row);
    }
    box.replaceChildren(frag);
  }

  // ---------- roles panel (coord/roles.json) ----------
  async function loadRoles() {
    const box = document.getElementById("roles");
    try {
      const r = await fetch("/api/roles", { cache: "no-store" });
      const data = await r.json(); if (!r.ok || data.error) throw 0;
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const frag = document.createDocumentFragment();
      for (const role of data.roles) {
        const row = el("div", "role");
        row.append(el("b", null, role.name));
        row.append(el("span", "pill " + (role.model || ""), role.model ? `${role.model} · ${role.effort}` : "człowiek"));
        row.append(el("span", "who", role.who));
        row.append(el("span", "does", role.does));
        for (const v of role.variants || []) row.append(el("span", "var", `↳ ${v.label}: ${v.model} · ${v.effort} (${v.when})`));
        frag.append(row);
      }
      box.replaceChildren(frag);
    } catch { box.previousElementSibling.hidden = true; box.hidden = true; }
  }

  // ---------- start ----------
  resize(); loadRoles();
  if (DEMO) {
    dot.className = "dot demo"; status.textContent = "tryb demo: symulowany swarm";
    const tick = makeDemo(); tick(); setInterval(tick, POLL_MS);
  } else {
    pollLive(); setInterval(pollLive, POLL_MS);
    setInterval(() => renderFeed(), 30000);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
