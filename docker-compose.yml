# InvestWatch: whole stack on-premise with `docker compose up`.
# Optional local LLM: `docker compose --profile llm up` (see README).

x-backend: &backend
  build: ./services/backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+pg8000://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://valkey:6379/0
    AI_URL: http://ai:8001
    S3_ENDPOINT: http://storage:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET:-evidence}
    SAMPLES_DIR: /samples
    FIXTURE_BASE_URL: http://backend:8000
    BACKEND_PORT: "8000"
    # login (defaults keep an older .env working: demo login on, random JWT secret per start)
    APP_ENV: ${APP_ENV:-development}
    JWT_SECRET: ${JWT_SECRET:-}
    JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
    COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    DEMO_LOGIN: ${DEMO_LOGIN:-true}
    DEMO_ANALYST_EMAIL: ${DEMO_ANALYST_EMAIL:-analityk@uknf.local}
    DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-}
    DEMO_SUPERVISOR_EMAIL: ${DEMO_SUPERVISOR_EMAIL:-kierownik@uknf.local}
    DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-}
  volumes:
    - ${SAMPLES_HOST_DIR:-./samples}:/samples:ro
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
    storage: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS, Apache-2.0) for archived HTML and screenshots.
  storage:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"investwatch","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=storage -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=20
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  ai:
    build: ./services/ai
    env_file: .env
    environment:
      AI_PORT: "8001"
      AI_DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes: [aidata:/data]
    ports: ["${AI_PORT:-8001}:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["api"]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      storage: { condition: service_healthy }
      ai: { condition: service_healthy }

  # Scale horizontally: docker compose up --scale worker=4
  worker:
    <<: *backend
    command: ["worker"]

  beat:
    <<: *backend
    command: ["beat"]

  frontend:
    build: ./services/frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["${FRONTEND_PORT:-3000}:8080"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.40.16
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  pgdata:
  objects:
  aidata:
  ollama:
