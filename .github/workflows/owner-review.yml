name: owner-review
# Every PR not authored by the owner:
#   1. Claude reviews it automatically (needs secret CLAUDE_CODE_OAUTH_TOKEN),
#   2. the owner is asked for review and the PR gets label needs:owner-review,
#   3. check "owner-approval" stays red until the owner approves the latest commit.
# GitHub Free can't block the merge button on private repos, so this check +
# the lead agent rules + main-guard.yml are what enforce it.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

env:
  OWNER: KNixt0
  LABEL: "needs:owner-review"

jobs:
  claude-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'KNixt0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret not set, skipping Claude review"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            AUTHOR: ${{ github.event.pull_request.user.login }}

            Review this pull request for the repo owner (KNixt0), who approves the merge after you.
            Read CLAUDE.md and coord/PROTOCOL.md first, then the linked issue (`Closes #n`).
            Check:
              - correctness bugs and security problems in the diff,
              - the diff stays inside the issue's "Owns" paths,
              - coord/contracts/* unchanged (or the change is justified),
              - "Done when" criteria are met,
              - the YAML handoff block is present.
            Put specific problems as inline comments.
            Finish with ONE summary comment via `gh pr comment`, under 15 lines, ending with exactly one line:
            claude-verdict: APPROVE   or   claude-verdict: CHANGES
          # Verifier role (coord/roles.json): Opus, effort high, a different model from the Sonnet builders.
          claude_args: |
            --model opus --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

  owner-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      ACTION: ${{ github.event.action }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Require owner approval on the latest commit
        run: |
          if [ "$AUTHOR" = "$OWNER" ]; then
            echo "PR by owner, no owner review needed."; exit 0
          fi

          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" != "synchronize" ]; then
            gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$OWNER" >/dev/null || true
          fi

          last=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"$OWNER\" and .state != \"COMMENTED\")] | last | \"\(.state // \"NONE\") \(.commit_id // \"\")\"")
          state=${last%% *}; commit=${last#* }

          if [ "$state" = "APPROVED" ] && [ "$commit" = "$HEAD" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/needs%3Aowner-review" >/dev/null 2>&1 || true
            echo "Approved by $OWNER on $HEAD."; exit 0
          fi

          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$LABEL" >/dev/null || true
          if [ "$state" = "APPROVED" ]; then
            echo "::error::$OWNER approved an older commit; new commits need a fresh approval."
          else
            echo "::error::Waiting for $OWNER to approve (current: $state). Do not merge."
          fi
          exit 1
