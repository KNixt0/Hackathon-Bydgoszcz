name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: bash scripts/check.sh
      - name: Handoff block present
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -qE '^status: ' || { echo "PR body is missing the YAML handoff block (coord/PROTOCOL.md §3)"; exit 1; }
