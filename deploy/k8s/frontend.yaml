# React SPA + nginx reverse proxy (/api, /socket.io → backend). The only entry point of the system.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx-unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: investwatch-frontend
          imagePullPolicy: IfNotPresent
          env:
            - { name: BACKEND_URL, value: "http://backend:8000" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: templates, mountPath: /etc/nginx/templates, readOnly: true }
            - { name: confd, mountPath: /etc/nginx/conf.d }   # entrypoint renders the template here
            - { name: tmp, mountPath: /tmp }                   # pid file and proxy buffers
      volumes:
        - name: templates
          configMap: { name: frontend-nginx }
        - { name: confd, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
