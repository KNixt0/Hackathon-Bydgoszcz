# Celery worker: scraper (httpx + Playwright/Chromium) and visual audit at 3 viewports.
# Scale with: kubectl -n investwatch scale deploy/worker --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
      - name: samples
        image: investwatch-samples
        imagePullPolicy: IfNotPresent
        command: [sh, -c, cp -R /samples/. /work/]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 200m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: samples, mountPath: /work}
      - name: wait-for-deps
        image: investwatch-backend
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - |
          import socket, time
          for host, port in [("postgres", 5432), ("valkey", 6379), ("storage", 8333), ("ai", 8001)]:
              while True:
                  try:
                      socket.create_connection((host, port), timeout=2).close(); print(host, "ok"); break
                  except OSError:
                      time.sleep(2)
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      containers:
      - name: worker
        image: investwatch-backend
        imagePullPolicy: IfNotPresent
        args: [worker]
        envFrom:
        - configMapRef: {name: investwatch-config}
        env:
        - {name: HOME, value: /tmp}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: POSTGRES_USER}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: POSTGRES_PASSWORD}
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: POSTGRES_DB}
        - {name: DATABASE_URL, value: 'postgresql+pg8000://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)'}
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: S3_ACCESS_KEY}
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: S3_SECRET_KEY}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: JWT_SECRET}
        - name: PUBLIC_REPORTS_SALT
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: PUBLIC_REPORTS_SALT}
        - name: DEMO_ANALYST_PASSWORD
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: DEMO_ANALYST_PASSWORD}
        - name: DEMO_SUPERVISOR_PASSWORD
          valueFrom:
            secretKeyRef: {name: investwatch-secrets, key: DEMO_SUPERVISOR_PASSWORD}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: '2', memory: 3Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: samples, mountPath: /samples, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: samples
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 1Gi}
