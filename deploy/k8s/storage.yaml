# S3-compatible object storage (SeaweedFS, Apache-2.0): archived HTML and screenshots.
# Only the S3 port is exposed through the Service; master/volume/filer talk inside the pod.
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  selector: { app.kubernetes.io/name: storage }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: storage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: storage }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: storage
          image: chrislusf/seaweedfs:3.80
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '{"identities":[{"name":"investwatch","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/s3.json
              exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=20
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: investwatch-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: investwatch-secrets, key: S3_SECRET_KEY } }
          ports:
            - { name: s3, containerPort: 8333 }
          startupProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: objects, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: objects
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
