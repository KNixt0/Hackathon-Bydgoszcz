# AI engine: module 1-3 plugins, UKNF criteria, scoring. /data holds runtime register snapshots.
apiVersion: v1
kind: Service
metadata:
  name: ai
spec:
  selector: { app.kubernetes.io/name: ai }
  ports:
    - { name: http, port: 8001, targetPort: 8001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aidata
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: 1
  strategy: { type: Recreate }   # RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: ai }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001     # "app" user of services/ai/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ai
          image: investwatch-ai
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: investwatch-config }
          ports:
            - { name: http, containerPort: 8001 }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 4
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: aidata }
        - { name: tmp, emptyDir: {} }
